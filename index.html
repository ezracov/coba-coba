<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Stok Barang - Supabase</title>
  <!-- Load Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input { padding: 8px; font-size: 14px; }
    button { padding: 8px 12px; cursor: pointer; background: #3ecf8e; border: none; color: white; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    .btn-del { background: #ff4d4f; }
  </style>
</head>
<body>

  <h2>Manajemen Stok Barang</h2>

  <!-- Form Tambah Data -->
  <form id="stokForm">
    <input type="text" id="namaBarang" placeholder="Nama Barang" required>
    <input type="number" id="jumlahBarang" placeholder="Jumlah" required min="1">
    <button type="submit">Tambah Barang</button>
  </form>

  <!-- Tabel Tampil Data -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nama Barang</th>
        <th>Jumlah</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tabelStok">
      <tr><td colspan="4">Memuat data...</td></tr>
    </tbody>
  </table>

  <script>
    // 1. Konfigurasi Kredensial Supabase Anda
    const SUPABASE_URL = 'https://bhvdieqxlrcxaoetpfnf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8-LtLA8sjuNFmZ-BPqHTqA_Tq4z7V_J';
    
    // Inisialisasi Client Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // DOM Elements
    const form = document.getElementById('stokForm');
    const namaInput = document.getElementById('namaBarang');
    const jumlahInput = document.getElementById('jumlahBarang');
    const tabelBody = document.getElementById('tabelStok');

    // 2. Fungsi Ambil Data (READ)
    async function fetchProduk() {
      const { data, error } = await supabase
        .from('produk')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error('Gagal mengambil data:', error);
        tabelBody.innerHTML = `<tr><td colspan="4">Gagal memuat data</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tabelBody.innerHTML = `<tr><td colspan="4">Belum ada barang.</td></tr>`;
        return;
      }

      tabelBody.innerHTML = data.map(item => `
        <tr>
          <td>${item.id}</td>
          <td>${item.nama_barang}</td>
          <td>${item.jumlah}</td>
          <td>
            <button class="btn-del" onclick="hapusProduk(${item.id})">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    // 3. Fungsi Tambah Data (CREATE)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nama = namaInput.value;
      const jumlah = parseInt(jumlahInput.value);

      const { error } = await supabase
        .from('produk')
        .insert([{ nama_barang: nama, jumlah: jumlah }]);

      if (error) {
        alert('Gagal menambah barang: ' + error.message);
      } else {
        namaInput.value = '';
        jumlahInput.value = '';
        fetchProduk(); // Refresh tabel
      }
    });

    // 4. Fungsi Hapus Data (DELETE)
    async function hapusProduk(id) {
      if (!confirm('Yakin ingin menghapus data ini?')) return;

      const { error } = await supabase
        .from('produk')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Gagal menghapus: ' + error.message);
      } else {
        fetchProduk(); // Refresh tabel
      }
    }

    // Load data pertama kali saat halaman dibuka
    fetchProduk();
  </script>
</body>
</html>
