<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Catatan Supabase</title>
  <!-- Load Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    h2 { color: #333; }
    .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background-color: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2eaf72; }
    ul { list-style: none; padding: 0; }
    li { background: #f4f4f4; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { background: #ff4d4d; padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>

  <h2>Catatan Saya</h2>
  
  <div class="form-group">
    <input type="text" id="noteInput" placeholder="Tulis catatan baru...">
    <button onclick="addNote()">Tambah</button>
  </div>

  <ul id="notesList"></ul>

  <script>
    // Konfigurasi Supabase
    const SUPABASE_URL = 'https://bhvdieqxlrcxaoetpfnf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8-LtLA8sjuNFmZ-BPqHTqA_Tq4z7V_J';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Ambil Data Catatan (Read)
    async function fetchNotes() {
      const { data, error } = await supabase
        .from('notes')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Gagal mengambil data:', error);
        return;
      }

      const listContainer = document.getElementById('notesList');
      listContainer.innerHTML = '';
      
      data.forEach(note => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${note.title}</span>
          <button class="delete-btn" onclick="deleteNote(${note.id})">Hapus</button>
        `;
        listContainer.appendChild(li);
      });
    }

    // 2. Tambah Catatan Baru (Create)
    async function addNote() {
      const input = document.getElementById('noteInput');
      const title = input.value.trim();

      if (!title) return alert('Catatan tidak boleh kosong!');

      const { error } = await supabase
        .from('notes')
        .insert([{ title: title }]);

      if (error) {
        console.error('Gagal menambah catatan:', error);
      } else {
        input.value = '';
        fetchNotes(); // Refresh daftar catatan
      }
    }

    // 3. Hapus Catatan (Delete)
    async function deleteNote(id) {
      const { error } = await supabase
        .from('notes')
        .delete()
        .eq('id', id);

      if (error) {
        console.error('Gagal menghapus catatan:', error);
      } else {
        fetchNotes(); // Refresh daftar catatan
      }
    }

    // Muat data saat pertama kali halaman dibuka
    fetchNotes();
  </script>
</body>
</html>
